<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhanaGo - Food Ordering</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f6fa;color:#222}
header{background:#138a50;color:white;padding:18px;text-align:center}
nav{display:flex;gap:10px;justify-content:center;padding:12px;background:white;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 16px;background:#138a50;color:white;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px}
.container{max-width:950px;margin:auto;padding:16px}
.card{background:white;padding:15px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.price{font-weight:bold;color:#138a50}
.hidden{display:none}
.small{font-size:13px;color:#666}
.item-actions{display:flex;gap:8px;align-items:center}
h2{margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>🍔 KhanaGo</h1>
  <p>Order your favourite food</p>
</header>

<nav>
  <button onclick="showPage('shop')">Food Menu</button>
  <button onclick="showPage('help')">Help / Chat</button>
</nav>

<main class="container">

<section id="shop">
  <h2>Our Food Menu</h2>
  <div class="grid" id="menu"></div>

  <div class="card">
    <h2>Your Cart</h2>
    <div id="cart">Cart is empty</div>
    <h3 id="total">Total: ₹0</h3>
    <h3>Customer Details</h3>
    <input id="customerName" placeholder="Your name">
    <input id="customerPhone" placeholder="Mobile number">
    <textarea id="customerAddress" placeholder="Delivery address"></textarea>
    <button onclick="placeOrder()">Place Order</button>
    <p class="small" id="orderStatus"></p>
  </div>
</section>

<section id="help" class="hidden">
  <div class="card">
    <h2>Customer Help</h2>
    <p>Apni problem ya question yahan bhejein.</p>
    <input id="helpName" placeholder="Your name">
    <input id="helpPhone" placeholder="Mobile number">
    <textarea id="helpMessage" placeholder="How can we help you?"></textarea>
    <button onclick="sendHelp()">Send Message</button>
    <p id="helpStatus"></p>
  </div>
  <p>WhatsApp: <a href="https://wa.me/917599044129" target="_blank">Chat with KhanaGo</a></p>
</section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// 1. Firebase Console se apni asli configuration yahan paste karein
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 2. Food menu
const products = [
  {name:"Special Veg Thali",price:149},
  {name:"Paneer Paratha",price:99},
  {name:"Cheese Paneer Sandwich",price:119},
  {name:"Schezwan Veg Sandwich",price:109},
  {name:"Brownie Shake",price:129},
  {name:"Cold Coffee",price:89},
  {name:"Chocolate Brownie",price:99},
  {name:"Gulab Jamun",price:69}
];

let cart = {};

function showPage(page){
  ["shop","help"].forEach(id =>
    document.getElementById(id).classList.add("hidden")
  );
  document.getElementById(page).classList.remove("hidden");
}

function renderMenu(){
  document.getElementById("menu").innerHTML = products.map((p,i)=>`
    <div class="card">
      <h3>${p.name}</h3>
      <p class="price">₹${p.price}</p>
      <button onclick="addToCart(${i})">Add to Cart</button>
    </div>
  `).join("");
}

function addToCart(i){
  cart[i] = (cart[i] || 0) + 1;
  renderCart();
}

function changeQty(i,amount){
  cart[i] = (cart[i] || 0) + amount;
  if(cart[i] <= 0) delete cart[i];
  renderCart();
}

function renderCart(){
  let total = 0;
  let html = "";
  Object.keys(cart).forEach(i=>{
    const p = products[i];
    const qty = cart[i];
    total += p.price * qty;
    html += `<p>${p.name} × ${qty} — ₹${p.price*qty}
      <span class="item-actions">
      <button onclick="changeQty(${i},-1)">−</button>
      <button onclick="changeQty(${i},1)">+</button>
      </span></p>`;
  });
  document.getElementById("cart").innerHTML = html || "Cart is empty";
  document.getElementById("total").innerText = "Total: ₹" + total;
}

async function placeOrder(){
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address || !Object.keys(cart).length){
    alert("Please fill all details and add food to cart.");
    return;
  }

  const items = Object.keys(cart).map(i=>({
    name:products[i].name,
    price:products[i].price,
    quantity:cart[i]
  }));
  const total = items.reduce((s,p)=>s+p.price*p.quantity,0);

  try{
    await db.collection("orders").add({
      name,phone,address,items,total,
      status:"New",
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("orderStatus").innerText =
      "Order successfully placed! Thank you.";

    const message = `New KhanaGo Order\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n${items.map(x=>x.name+" x "+x.quantity).join("\n")}\nTotal: ₹${total}`;

    window.open("https://wa.me/917599044129?text="+encodeURIComponent(message),"_blank");

    cart = {};
    renderCart();
  }catch(error){
    alert("Order failed: " + error.message);
  }
}

async function sendHelp(){
  const name = document.getElementById("helpName").value.trim();
  const phone = document.getElementById("helpPhone").value.trim();
  const message = document.getElementById("helpMessage").value.trim();

  if(!name || !phone || !message){
    alert("Please fill all fields.");
    return;
  }

  try{
    await db.collection("helpMessages").add({
      name,phone,message,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById("helpStatus").innerText =
      "Your message has been sent to KhanaGo. Thank you!";
    document.getElementById("helpMessage").value = "";
  }catch(error){
    alert("Message failed: " + error.message);
  }
}

renderMenu();
renderCart();
</script>
</body>
</html>
