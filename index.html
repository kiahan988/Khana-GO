<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>khanaGo - Food Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .brand-bg { background: linear-gradient(135deg, #FF512F 0%, #F09819 100%); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Top Header with khanaGo Logo -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div onclick="goToOnboarding()" class="flex items-center gap-2.5 cursor-pointer">
        <div class="w-10 h-10 rounded-xl brand-bg flex items-center justify-center shadow">
          <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 16h18M4 16a8 8 0 0116 0M12 5v3M9 6h6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 19h14" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <span class="text-2xl font-extrabold tracking-tight text-gray-900">khana<span class="text-orange-600">Go</span></span>
          <p class="text-[10px] font-semibold uppercase tracking-wider text-gray-400 -mt-1">Food Delivery</p>
        </div>
      </div>

      <button id="cartBtn" onclick="toggleCart()" class="hidden bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-gray-800 transition">
        <span>Cart</span>
        <span id="cartCount" class="bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- PAGE 1: CUSTOMER DETAILS & CURRENT LOCATION -->
  <main id="pageCustomerDetails" class="flex-1 flex items-center justify-center p-4 py-8">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
      <div class="brand-bg p-6 text-white">
        <h1 class="text-2xl font-extrabold">Customer Delivery Details</h1>
        <p class="text-sm text-orange-100 mt-1">Apni detail bharein ya current location allow karein.</p>
      </div>

      <form id="customerDetailsForm" class="p-6 space-y-4">
        <!-- Current Location Box -->
        <div class="bg-orange-50 border border-orange-200 rounded-xl p-3.5 flex items-center justify-between gap-3">
          <div>
            <p class="text-sm font-bold text-gray-900">Use Current Location</p>
            <p id="locStatus" class="text-xs text-gray-500">Location allow karne ke liye button dabayein</p>
          </div>
          <button type="button" id="locBtn" onclick="requestCurrentLocation()" class="shrink-0 bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-lg shadow transition">
            Use Current Location
          </button>
        </div>

        <input type="hidden" id="latInput" />
        <input type="hidden" id="lngInput" />

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Customer Name *</label>
            <input type="text" id="nameInput" required placeholder="Apna naam likhein" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Phone Number *</label>
            <input type="tel" id="phoneInput" required pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile number" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Floor & Building Number *</label>
            <input type="text" id="buildingInput" required placeholder="e.g. Ground Floor, House 12" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Pincode *</label>
            <input type="text" id="pincodeInput" required pattern="[0-9]{6}" maxlength="6" placeholder="6 digit pincode" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Address *</label>
          <textarea id="addressInput" rows="2" required placeholder="Gali, Mohalla, Area, Landmark..." class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none text-sm"></textarea>
        </div>

        <button type="submit" class="w-full brand-bg text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-95 transition text-sm">
          Continue to Shops →
        </button>
      </form>
    </div>
  </main>

  <!-- PAGE 2: ONBOARDED SHOPS LIST -->
  <section id="pageShops" class="hidden max-w-6xl mx-auto w-full px-4 py-6 flex-1">
    <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span id="viewName" class="font-bold text-sm text-gray-900"></span>
          <span id="viewPhone" class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600"></span>
        </div>
        <p id="viewAddress" class="text-xs text-gray-600 mt-0.5"></p>
        <p id="viewGps" class="text-[11px] text-green-600 font-semibold mt-0.5"></p>
      </div>
      <button onclick="goToOnboarding()" class="text-xs font-bold text-orange-600 hover:underline self-start sm:self-center">
        Edit Details / Location
      </button>
    </div>

    <h2 class="text-xl font-extrabold text-gray-900 mb-4">Available Shops</h2>
    <div id="shopsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </section>

  <!-- CART DRAWER -->
  <div id="cartDrawer" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-5 shadow-2xl">
      <div>
        <div class="flex items-center justify-between border-b pb-3">
          <h3 class="text-lg font-extrabold">Your Cart</h3>
          <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-900 font-bold text-xl">&times;</button>
        </div>
        <div id="cartItems" class="mt-4 space-y-3 max-h-[55vh] overflow-y-auto"></div>
      </div>

      <div class="border-t pt-4 space-y-3">
        <div class="flex justify-between font-extrabold text-base">
          <span>Total Amount</span>
          <span id="cartTotal">₹0</span>
        </div>
        <div class="space-y-2 text-xs font-semibold text-gray-700">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="payMode" value="Cash on Delivery (COD)" checked />
            <span>Cash on Delivery (COD)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="payMode" value="UPI" />
            <span>UPI</span>
          </label>
        </div>
        <button onclick="submitOrder()" class="w-full brand-bg text-white font-bold py-3.5 rounded-xl shadow-lg text-sm">
          Place Order
        </button>
      </div>
    </div>
  </div>

  <script>
    // Yahan aap apne onboard kiye hue shops aur unka menu update kar sakte hain
    const onboardedShops = [
      {
        id: 1,
        name: "Sharma Misthan & Bhojnalaya",
        category: "Meals & Snacks",
        deliveryTime: "20-30 mins",
        items: [
          { name: "Special Thali", price: 120 },
          { name: "Paneer Paratha (2 pcs)", price: 90 },
          { name: "Samosa (2 pcs)", price: 30 }
        ]
      },
      {
        id: 2,
        name: "Delicious Fast Food Corner",
        category: "Burger, Chowmein & Rolls",
        deliveryTime: "15-25 mins",
        items: [
          { name: "Veg Burger", price: 60 },
          { name: "Veg Chowmein", price: 70 },
          { name: "Spring Roll", price: 80 }
        ]
      }
    ];

    let customer = JSON.parse(localStorage.getItem("khanago_cust")) || null;
    let cart = [];

    window.onload = () => {
      if (customer) {
        showShopsPage();
      }
    };

    function requestCurrentLocation() {
      const status = document.getElementById("locStatus");
      const btn = document.getElementById("locBtn");

      if (!navigator.geolocation) {
        status.textContent = "Browser location support nahi karta.";
        return;
      }

      status.textContent = "Location permission maangi ja rahi hai...";
      btn.textContent = "Fetching...";

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          document.getElementById("latInput").value = lat;
          document.getElementById("lngInput").value = lng;

          status.innerHTML = `<span class="text-green-600 font-bold">Location allowed & captured (${lat}, ${lng})</span>`;
          btn.textContent = "Location Set ✓";
          btn.classList.replace("bg-orange-600", "bg-green-600");

          try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const info = await resp.json();
            if (info && info.address) {
              if (info.address.postcode) {
                document.getElementById("pincodeInput").value = info.address.postcode;
              }
              if (info.display_name && !document.getElementById("addressInput").value) {
                document.getElementById("addressInput").value = info.display_name;
              }
            }
          } catch (err) {
            // Manual address entry remains available
          }
        },
        () => {
          status.innerHTML = `<span class="text-red-600 font-semibold">Location allow nahi ki gayi. Address manually bharein.</span>`;
          btn.textContent = "Allow Location";
        },
        { enableHighAccuracy: true }
      );
    }

    document.getElementById("customerDetailsForm").addEventListener("submit", (e) => {
      e.preventDefault();
      customer = {
        name: document.getElementById("nameInput").value.trim(),
        phone: document.getElementById("phoneInput").value.trim(),
        building: document.getElementById("buildingInput").value.trim(),
        pincode: document.getElementById("pincodeInput").value.trim(),
        address: document.getElementById("addressInput").value.trim(),
        lat: document.getElementById("latInput").value,
        lng: document.getElementById("lngInput").value
      };
      localStorage.setItem("khanago_cust", JSON.stringify(customer));
      showShopsPage();
    });

    function showShopsPage() {
      document.getElementById("pageCustomerDetails").classList.add("hidden");
      document.getElementById("pageShops").classList.remove("hidden");
      document.getElementById("cartBtn").classList.remove("hidden");

      document.getElementById("viewName").textContent = customer.name;
      document.getElementById("viewPhone").textContent = customer.phone;
      document.getElementById("viewAddress").textContent = `${customer.building}, ${customer.address} - ${customer.pincode}`;
      document.getElementById("viewGps").textContent = customer.lat
        ? `Current Location: ${customer.lat}, ${customer.lng}`
        : "Manual Address";

      renderShops();
    }

    function goToOnboarding() {
      if (customer) {
        document.getElementById("nameInput").value = customer.name;
        document.getElementById("phoneInput").value = customer.phone;
        document.getElementById("buildingInput").value = customer.building;
        document.getElementById("pincodeInput").value = customer.pincode;
        document.getElementById("addressInput").value = customer.address;
        document.getElementById("latInput").value = customer.lat || "";
        document.getElementById("lngInput").value = customer.lng || "";
      }
      document.getElementById("pageShops").classList.add("hidden");
      document.getElementById("pageCustomerDetails").classList.remove("hidden");
    }

    function renderShops() {
      const box = document.getElementById("shopsContainer");
      box.innerHTML = onboardedShops.map(shop => `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-4 bg-orange-50 border-b">
            <h3 class="font-extrabold text-base text-gray-900">${shop.name}</h3>
            <p class="text-xs text-gray-500 mt-0.5">${shop.category} • ${shop.deliveryTime}</p>
          </div>
          <div class="p-4 space-y-2.5">
            ${shop.items.map(item => `
              <div class="flex items-center justify-between text-sm border-b border-dashed pb-2 last:border-none">
                <div>
                  <p class="font-semibold text-gray-800">${item.name}</p>
                  <p class="text-xs font-bold text-orange-600">₹${item.price}</p>
                </div>
                <button onclick="addItem('${shop.name}', '${item.name}', ${item.price})" class="bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                  Add
                </button>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function addItem(shopName, itemName, price) {
      cart.push({ shopName, itemName, price });
      refreshCart();
    }

    function removeItem(idx) {
      cart.splice(idx, 1);
      refreshCart();
    }

    function refreshCart() {
      document.getElementById("cartCount").textContent = cart.length;
      const list = document.getElementById("cartItems");
      let total = 0;

      if (cart.length === 0) {
        list.innerHTML = `<p class="text-sm text-gray-500 text-center py-8">Cart khali hai.</p>`;
      } else {
        list.innerHTML = cart.map((c, i) => {
          total += c.price;
          return `
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
              <div>
                <p class="font-bold text-sm">${c.itemName}</p>
                <p class="text-xs text-gray-500">${c.shopName}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-sm">₹${c.price}</span>
                <button onclick="removeItem(${i})" class="text-red-500 text-xs font-bold">✕</button>
              </div>
            </div>
          `;
        }).join("");
      }
      document.getElementById("cartTotal").textContent = "₹" + total;
    }

    function toggleCart() {
      document.getElementById("cartDrawer").classList.toggle("hidden");
      refreshCart();
    }

    function submitOrder() {
      if (cart.length === 0) return alert("Pehle koi item add karein.");
      const mode = document.querySelector('input[name="payMode"]:checked').value;
      alert(
        `Order placed!\n\nName: ${customer.name}\nPhone: ${customer.phone}\nAddress: ${customer.building}, ${customer.address} (${customer.pincode})\nPayment: ${mode}`
      );
      cart = [];
      refreshCart();
      toggleCart();
    }
  </script>
</body>
</html>
